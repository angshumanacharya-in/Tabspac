<!DOCTYPE html>
<html lang="en" class="dark">
<head>

    <title>404 - Solution Not Found | Tabspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;

        <div class="w-full flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 select-none">

    <main class="w-full max-w-2xl mx-auto px-6 py-20 text-center space-y-6 flex-grow flex flex-col justify-center">

        <h2 class="text-2xl md:text-3xl font-bold text-white">Solution Not Available Yet</h2>
        <p class="text-zinc-400 text-sm md:text-base leading-relaxed">

        </p>
        <div class="pt-4">
            <a href="../" class="inline-block px-6 py-3 bg-zinc-900 border border-zinc-800 text-zinc-200 font-bold rounded-xl hover:border-brand-orange hover:text-brand-orange transition-all duration-200 font-sans">
                &larr; Back to Directory

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 border-t border-zinc-900 text-center">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> Presentations &copy; 2026. All rights reserved.

</html>
